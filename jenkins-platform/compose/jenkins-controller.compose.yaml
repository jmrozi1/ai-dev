services:
  controller:
    image: jenkins-platform/jenkins-controller:2.516.3-jdk21
    container_name: jenkins-controller-dev
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
    volumes:
      - jenkins-controller-home:/var/jenkins_home
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: "no"

volumes:
  jenkins-controller-home:
